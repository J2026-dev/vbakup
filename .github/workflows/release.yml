name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w" -o vbakup-agent-linux-${{ matrix.arch }} ./cmd/agent
      - run: sha256sum vbakup-agent-linux-${{ matrix.arch }} > vbakup-agent-linux-${{ matrix.arch }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vbakup-agent-linux-${{ matrix.arch }}
            vbakup-agent-linux-${{ matrix.arch }}.sha256
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/j2026-dev/vbakup:latest
            ghcr.io/j2026-dev/vbakup:${{ github.ref_name }}
